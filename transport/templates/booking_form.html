<!DOCTYPE html>
<html>
<head>
    <title>Book Your Ride</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background: #f4f4f4; }
        .form-container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #555; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Enter Booking Details</h2>
        <form action="{% url 'send_whatsapp' %}" method="POST">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="text" name="phone" placeholder="Contact Number" required>
            <input type="text" name="pickup" placeholder="Pick up Location" required>
            <input type="text" name="destination" placeholder="Drop off Location" required>
            <button type="submit">Send Booking via WhatsApp</button>
        </form>
        <a href="{% url 'index' %}" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
