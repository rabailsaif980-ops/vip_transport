<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | VIP Transport Riyadh</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{

background:#111;

font-family:Arial, Helvetica, sans-serif;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:30px;

}

.contact-box{

background:white;

width:100%;

max-width:700px;

padding:45px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.35);

}

.contact-box h2{

text-align:center;

font-weight:bold;

margin-bottom:10px;

}

.contact-box p{

text-align:center;

color:#666;

margin-bottom:35px;

}

.contact-item{

display:flex;

align-items:center;

padding:18px;

margin-bottom:18px;

border-radius:12px;

background:#f8f8f8;

transition:.3s;

}

.contact-item:hover{

background:#d4af37;

color:#111;

transform:translateY(-3px);

}

.contact-item i{

font-size:28px;

width:55px;

text-align:center;

color:#111;

}

.contact-item div{

margin-left:15px;

}

.contact-item h5{

margin:0;

font-weight:bold;

}

.contact-item p{

margin:0;

text-align:left;

color:#555;

}

.whatsapp-btn{

display:block;

width:100%;

padding:15px;

background:#25D366;

color:white;

font-size:18px;

font-weight:bold;

text-align:center;

border-radius:12px;

text-decoration:none;

margin-top:25px;

transition:.3s;

}

.whatsapp-btn:hover{

background:#128C7E;

color:white;

}

.back-home{

display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

font-weight:bold;

color:#111;

}

.back-home:hover{

color:#d4af37;

}

</style>

</head>

<body>

<div class="contact-box">

<h2>Contact VIP Transport Riyadh</h2>

<p>
We're available 24/7 to help with bookings and inquiries.
</p>

<div class="contact-item">

<i class="fa-solid fa-phone"></i>

<div>

<h5>Phone</h5>

<p>+966 599181070</p>

</div>

</div>

<div class="contact-item">

<i class="fa-brands fa-whatsapp"></i>

<div>

<h5>WhatsApp</h5>

<p>Available 24 Hours</p>

</div>

</div>

<div class="contact-item">

<i class="fa-solid fa-location-dot"></i>

<div>

<h5>Location</h5>

<p>Riyadh, Saudi Arabia</p>

</div>

</div>

<div class="contact-item">

<i class="fa-solid fa-clock"></i>

<div>

<h5>Working Hours</h5>

<p>24 Hours / 7 Days</p>

</div>

</div>

<a
href="https://wa.me/966599181070"
target="_blank"
class="whatsapp-btn">

<i class="fa-brands fa-whatsapp"></i>

Chat on WhatsApp

</a>

<a href="{% url 'index' %}" class="back-home">

← Back to Home

</a>

</div>

</body>

</html>
