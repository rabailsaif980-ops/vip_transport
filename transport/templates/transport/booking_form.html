<!DOCTYPE html>
<html>
<head>
    <title>Book Your Ride</title>
</head>
<body>

<form action="{% url 'send_whatsapp' %}" method="POST" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; font-family: sans-serif;">
    {% csrf_token %}
    <h2 style="text-align: center;">Book Your Luxury Ride</h2>
    
    <label>Customer Name:</label><br>
    <input type="text" name="name" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>

    <label>Contact Number:</label><br>
    <input type="text" name="phone" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>

    <label>Pick up Location:</label><br>
    <input type="text" name="pickup" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>

    <label>Drop off Location:</label><br>
    <input type="text" name="destination" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>

    <button type="submit" style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Confirm & Send WhatsApp</button>
</form>

</body>
</html>
